[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dzh-protocol"
version = "0.2.0"
description = "Hybrid DuckDB + Zarr ingestion protocol for heterogeneous bioinformatics data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Neha", email = "neha10@uon.edu.au"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "duckdb>=1.0.0",
    "zarr>=3.0.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
dzh = "dzh_protocol.cli:main"

[project.urls]
Homepage = "https://github.com/nehaar/dzh-protocol"
Repository = "https://github.com/nehaar/dzh-protocol"

[tool.hatch.build.targets.wheel]
packages = ["src/dzh_protocol"]
